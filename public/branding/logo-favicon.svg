<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Premium Dark Rounded Container -->
  <rect width="512" height="512" rx="128" fill="#030303" stroke="rgba(255, 255, 255, 0.08)" stroke-width="8" />
  
  <defs>
    <!-- Infrastructure Blue/Cyan Gradient -->
    <linearGradient id="navyCyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="30%" stop-color="#1e3a8a" />
      <stop offset="70%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Outer Network Ring Gradient -->
    <linearGradient id="networkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.6" />
    </linearGradient>

    <!-- Central Flame Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="60%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Inner Flame High Intensity Core Gradient -->
    <linearGradient id="innerGoldGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Subtle Outer Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark centered with scale 0.7 -->
  <g transform="translate(76.8, 76.8) scale(0.7)">
    <!-- Outer Network Dashed Ring -->
    <path d="M 226 59 A 215 215 0 0 0 41 256 A 215 215 0 0 0 226 453" stroke="url(#networkGrad)" stroke-width="3" stroke-dasharray="8 12" stroke-linecap="round" />
    <path d="M 286 59 A 215 215 0 0 1 471 256 A 215 215 0 0 1 286 453" stroke="url(#networkGrad)" stroke-width="3" stroke-dasharray="8 12" stroke-linecap="round" />

    <!-- Thick Protective Arcs (Aashray) -->
    <path d="M 206 82 A 180 180 0 0 0 76 256 A 180 180 0 0 0 206 430" stroke="url(#navyCyanGrad)" stroke-width="18" stroke-linecap="round" />
    <path d="M 306 82 A 180 180 0 0 1 436 256 A 180 180 0 0 1 306 430" stroke="url(#navyCyanGrad)" stroke-width="18" stroke-linecap="round" />

    <!-- Node Markers -->
    <circle cx="206" cy="82" r="6" fill="#fbbf24" />
    <circle cx="206" cy="430" r="6" fill="#fbbf24" />
    <circle cx="306" cy="82" r="6" fill="#fbbf24" />
    <circle cx="306" cy="430" r="6" fill="#fbbf24" />

    <!-- Flame Core -->
    <path d="M 256 135 C 210 215, 200 285, 220 335 C 230 360, 242 368, 256 368 C 270 368, 282 360, 292 335 C 312 285, 302 215, 256 135 Z" fill="url(#goldGrad)" filter="url(#glow)" />
    <path d="M 256 195 C 232 245, 228 290, 240 325 C 245 338, 250 342, 256 342 C 262 342, 267 338, 272 325 C 284 290, 280 245, 256 195 Z" fill="url(#innerGoldGrad)" opacity="0.95" />
  </g>
</svg>
